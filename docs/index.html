<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf9"><title>ABH — Sticker Pack</title><meta name="description" content="Four Agentic Banking Hackathon stickers. Pick one, move it, and peel a corner."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff571d'/%3E%3Cpath d='M8 23V9h16v14h-4v-6h-8v6zm4-10h8v-1h-8z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./" aria-label="Agentic Banking Hackathon sticker pack"><img class="brand-logo" src="assets/abh-logo.png" alt="ABH — Agentic Banking Hackathon"></a></header>
<main><div id="stage" role="img" tabindex="0" aria-label="Interactive 3D hackathon sticker. Drag the center to move, pull a corner to peel, or press arrow keys to change stickers."><img id="fallback" src="assets/sticker-1.png" alt="Agentic Banking Hackathon orange square sticker"></div><div class="caption" aria-live="polite"><h1 id="sticker-title">Sticker 01 — Solar</h1></div></main>
